# One file, two stacks on the same box: production and staging.
#
# Every name that has to be unique per stack is a variable whose default is
# what production has always used, so production's .env needs none of them.
# Staging's .env sets them all — see docs/deploy/staging.md. Leaving one out
# there is not a harmless default: the stack would take over production's
# containers, image tags or routes.
#
#   STACK_NAME       compose project, image tags        (default doctor_1)
#   ROUTER_NAME      Traefik router/service/middleware  (default doctor1)
#   DEPLOY_APP_ENV   APP_ENV inside the containers      (default production)
#
# APP_HOST_WWW and APP_HOST_LEGACY fall back to APP_HOST, never to
# production's names: an unset one must not let staging claim www.elayadah.com.
# Production's .env sets both explicitly.
#
# DEPLOY_APP_ENV rather than APP_ENV on purpose: a stray APP_ENV=local in
# production's .env must not be able to switch production out of production.
name: ${STACK_NAME:-doctor_1}

services:
  web:
    image: ${STACK_NAME:-doctor_1}-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    volumes:
      - app_storage:/app/storage:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.${ROUTER_NAME:-doctor1}.rule=Host(`${APP_HOST:?Set APP_HOST in .env}`) || Host(`${APP_HOST_WWW:-${APP_HOST}}`) || Host(`${APP_HOST_LEGACY:-${APP_HOST}}`)
      - traefik.http.routers.${ROUTER_NAME:-doctor1}.entrypoints=web,websecure
      - traefik.http.routers.${ROUTER_NAME:-doctor1}.tls=true
      - traefik.http.routers.${ROUTER_NAME:-doctor1}.tls.certresolver=mytlschallenge
      - traefik.http.services.${ROUTER_NAME:-doctor1}.loadbalancer.server.port=80
      - traefik.http.middlewares.${ROUTER_NAME:-doctor1}-headers.headers.STSSeconds=31536000
      - traefik.http.middlewares.${ROUTER_NAME:-doctor1}-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.${ROUTER_NAME:-doctor1}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${ROUTER_NAME:-doctor1}-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.${ROUTER_NAME:-doctor1}-headers.headers.STSIncludeSubdomains=true
      - traefik.http.routers.${ROUTER_NAME:-doctor1}.middlewares=${ROUTER_NAME:-doctor1}-headers@docker
    networks:
      - app
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  app:
    image: ${STACK_NAME:-doctor_1}-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: https://${APP_HOST:?Set APP_HOST in .env}
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
      APP_ENV: ${DEPLOY_APP_ENV:-production}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    image: ${STACK_NAME:-doctor_1}-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: https://${APP_HOST:?Set APP_HOST in .env}
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
      APP_ENV: ${DEPLOY_APP_ENV:-production}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/app/storage
    # Without this the service lands on the project's default network, where
    # `mysql` does not resolve — every scheduled run died acquiring its
    # withoutOverlapping lock, silently, because nothing was due the other
    # 59 minutes of the hour.
    networks:
      - app

  queue:
    image: ${STACK_NAME:-doctor_1}-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: https://${APP_HOST:?Set APP_HOST in .env}
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
      APP_ENV: ${DEPLOY_APP_ENV:-production}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    # Without this, every dispatched job — the WhatsApp confirmation
    # among them — sits in the `jobs` table for ever.
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=30", "--max-time=3600", "--sleep=3"]
    volumes:
      - app_storage:/app/storage
    networks:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  app:
  traefik:
    external: true
    name: n8n_default

volumes:
  app_storage:
  mysql_data:
