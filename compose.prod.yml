name: doctor_1

services:
  app:
    image: doctor_1-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_bootstrap_cache:/app/bootstrap/cache
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.doctor1.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.doctor1.entrypoints=web,websecure
      - traefik.http.routers.doctor1.tls=true
      - traefik.http.routers.doctor1.tls.certresolver=mytlschallenge
      - traefik.http.services.doctor1.loadbalancer.server.port=8000
      - traefik.http.middlewares.doctor1-headers.headers.STSSeconds=31536000
      - traefik.http.middlewares.doctor1-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.doctor1-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.doctor1-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.doctor1-headers.headers.STSIncludeSubdomains=true
      - traefik.http.routers.doctor1.middlewares=doctor1-headers@docker
    networks:
      - app
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/up\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    image: doctor_1-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/app/storage
      - app_bootstrap_cache:/app/bootstrap/cache
    networks:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  app:
  traefik:
    external: true
    name: n8n_default

volumes:
  app_storage:
  app_bootstrap_cache:
  mysql_data:
