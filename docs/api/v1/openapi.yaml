openapi: 3.1.0

info:
  title: Doctor 1 — Clinic Booking & Calendar API
  version: "1.0.0"
  description: |
    The complete v1 API, consumed by the Flutter app.

    **This file is the source of truth.** The Postman collection is generated
    from it (`php artisan api:postman`), and a test fails if a registered route
    is missing here — so it cannot drift from the code.

    ## The envelope

    Every response is one of three shapes, including 404s and 500s:

    ```
    { "status": "success", "message": "...", "data": { } }
    { "status": "error",   "message": "...", "error": { code, details, fields } }
    ```

    Branch on `error.code` — a stable UPPER_SNAKE string — never on `message`,
    which is localised prose meant to be shown to the user as-is.

    ## value + display

    Anything rendered as text arrives pre-formatted, driven by
    `Accept-Language`, so the client never re-implements Arabic formatting.
    Use `value` for logic, show `display`.

    ## Clinic scope

    The clinic comes from the token. **No endpoint accepts `clinic_id`.**
    Another clinic's record returns 404, never its data.
  contact:
    name: Backend
    url: https://github.com/

servers:
  - url: "{base_url}/api/v1"
    variables:
      base_url:
        default: http://127.0.0.1:8000
        description: Host without a trailing slash

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Sign in, sign out, and who am I
  - name: Bootstrap
    description: One launch call
  - name: Settings
    description: Visit types, weekly hours, holidays
  - name: Booking
    description: The day strip, slots and the New Booking screen
  - name: Status
    description: Booking status changes
  - name: Postpone
    description: Postponing a day and the call list
  - name: Emergency
    description: Delaying today's appointments when the doctor is held up
  - name: Messaging
    description: WhatsApp template previews and log-driver sends
  - name: Patients
    description: Search and visit history
  - name: Reviews
    description: What patients said about their visits
  - name: Reports
    description: Revenue and retention, and the link that opens the doctor's reports page in a WebView

paths:

  # ---------------------------------------------------------------- Auth ----

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and receive a token
      description: Rate limited to 10 per minute. The only unauthenticated endpoint.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "doctor@doctor1.test"
                  description: Shared clinic login email.
                password: { type: string, example: password }
                device_name:
                  type: string
                  maxLength: 100
                  description: Labels the token so one device can be signed out alone.
                  example: pixel-8
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoginPayload" }
        "401":
          description: |
            `INVALID_CREDENTIALS` — a wrong email and a wrong password are
            deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ACCOUNT_INACTIVE`, or `FORBIDDEN_ROLE` for a super admin (panel only)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: Too many attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the calling token only
      description: Other devices stay signed in. `data` is null.
      operationId: logout
      responses:
        "200": { $ref: "#/components/responses/EmptySuccess" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ----------------------------------------------------------- Bootstrap ----

  /bootstrap:
    get:
      tags: [Bootstrap]
      summary: Everything the app needs on launch
      description: Clinic config, visit types, the full week and holidays, in one round trip.
      operationId: bootstrap
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clinic: { $ref: "#/components/schemas/Clinic" }
                          visit_types:
                            type: array
                            items: { $ref: "#/components/schemas/VisitType" }
                          schedule:
                            type: array
                            description: Always seven entries, Saturday first.
                            items: { $ref: "#/components/schemas/ScheduleDay" }
                          holidays:
                            type: array
                            items: { $ref: "#/components/schemas/Holiday" }
                          abilities: { $ref: "#/components/schemas/Abilities" }
                          user:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                              role: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ClinicScope" }

  /home:
    get:
      tags: [Bootstrap]
      summary: Home screen summary
      description: Today's status counts plus the next upcoming appointments.
      operationId: home
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          today:
                            type: object
                            properties:
                              date: { type: string, format: date }
                              counts: { $ref: "#/components/schemas/StatusCounts" }
                          upcoming:
                            type: array
                            items: { $ref: "#/components/schemas/BookingCard" }

  # ------------------------------------------------------------ Settings ----

  /visit-types:
    get:
      tags: [Settings]
      summary: List visit types
      operationId: listVisitTypes
      parameters:
        - name: include_hidden
          in: query
          schema: { type: boolean }
          description: Also return hidden types.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/VisitType" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Settings]
      summary: Add a visit type
      description: Clinic accounts can manage visit type duration, visibility and price.
      operationId: createVisitType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitTypeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VisitType" }
        "400":
          description: "`VISIT_TYPE_DUPLICATE_NAME` — another *active* type has this name"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /visit-types/{visitType}:
    parameters:
      - $ref: "#/components/parameters/VisitTypeId"
    put:
      tags: [Settings]
      summary: Replace a visit type
      description: Full replacement, not a patch.
      operationId: updateVisitType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitTypeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VisitType" }
        "400":
          description: "`VISIT_TYPE_DUPLICATE_NAME`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Settings]
      summary: Hide a visit type
      description: |
        **Hides, never deletes** — bookings reference this row forever and carry
        its snapshotted price and duration. Returns the updated record with
        `is_active: false`.
      operationId: hideVisitType
      responses:
        "200":
          description: Hidden
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VisitType" }
        "400":
          description: "`VISIT_TYPE_LAST_ACTIVE` — at least one must remain or booking becomes impossible"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedule:
    get:
      tags: [Settings]
      summary: The weekly hours
      description: Always all seven days, Saturday first, open or not.
      operationId: getSchedule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          days:
                            type: array
                            items: { $ref: "#/components/schemas/ScheduleDay" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /schedule/{day}:
    parameters:
      - name: day
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 6 }
        description: "0 = السبت (Saturday) … 6 = الجمعة (Friday). Saturday-first."
        example: 0
    put:
      tags: [Settings]
      summary: Replace one day
      description: |
        Replaces the whole day — send every period you want kept. Period ids are
        **not stable** across a save; never hold onto one. Closing a day drops
        its periods whatever you send.

        **A period may run past midnight.** An `end_time` earlier than its
        `start_time` (`19:00` → `03:00`) closes the next morning, and every
        booking in it — the 01:00 ones included — belongs to *this* day. It
        must close by `06:00`. While it is open nothing else may start before
        its close: not another period on this day, and not the next day.
        Such a period comes back with `ends_next_day: true`.
      operationId: updateScheduleDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_open]
              properties:
                is_open: { type: boolean, example: true }
                periods:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [start_time, end_time]
                    properties:
                      start_time: { type: string, pattern: '^\d{2}:\d{2}$', example: "13:00" }
                      end_time: { type: string, pattern: '^\d{2}:\d{2}$', example: "15:00" }
                  example:
                    - { start_time: "13:00", end_time: "15:00" }
                    - { start_time: "17:00", end_time: "21:00" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ScheduleDay" }
        "400":
          description: |
            `SCHEDULE_PERIOD_INVALID` — an open day with no periods, a period
            that starts and ends at the same time, or one that runs past
            midnight and closes after `06:00`.

            `SCHEDULE_PERIOD_OVERLAP` — two periods overlap (`details.first`
            and `details.second` name them), or a period starts before an
            overnight period has closed: this day's own, or the day before's.
            Then `details` carries `day` (the day whose night it is),
            `closes_at`, and the offending `period`.

            Back-to-back periods are fine, including `03:00` straight after a
            night that closes at `03:00`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`SCHEDULE_DAY_NOT_FOUND` — day outside 0–6"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /holidays:
    get:
      tags: [Settings]
      summary: One-off closures
      operationId: listHolidays
      parameters:
        - name: include_past
          in: query
          schema: { type: boolean }
          description: Include holidays before today.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Holiday" }
    post:
      tags: [Settings]
      summary: Close a day
      description: |
        Refused when patients are still booked that day, with the count in
        `error.details.bookings_count`. Send the patients to the postpone flow,
        or retry with `force: true` — which marks the holiday but **cancels
        nothing**.
      operationId: createHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date, example: "2026-08-20" }
                note: { type: string, maxLength: 255, example: سفر }
                force:
                  type: boolean
                  description: Confirms closing a day that already has bookings.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Holiday" }
        "409":
          description: "`HOLIDAY_ALREADY_EXISTS` or `HOLIDAY_HAS_BOOKINGS`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                hasBookings:
                  value:
                    status: error
                    message: في 3 حجز في اليوم ده. أجّلي المريضات الأول أو أكّدي إضافة الإجازة.
                    error:
                      code: HOLIDAY_HAS_BOOKINGS
                      details: { bookings_count: 3, date: "2026-08-12" }
                      fields: null
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /holidays/{holiday}:
    parameters:
      - name: holiday
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Settings]
      summary: Remove a holiday
      operationId: deleteHoliday
      responses:
        "200": { $ref: "#/components/responses/EmptySuccess" }
        "404":
          description: "`HOLIDAY_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /settings/general:
    put:
      tags: [Settings]
      summary: Booking window, arrival lead and retention threshold
      description: All fields optional — send only what changed.
      operationId: updateGeneralSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_window_days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  description: How far ahead booking opens.
                  example: 7
                first_visit_only_days:
                  type: integer
                  minimum: 1
                  maximum: 730
                  description: A single visit older than this counts as never returned.
                  example: 60
                patient_arrival_lead_minutes:
                  type: integer
                  enum: [15, 20, 30, 45, 60]
                  description: How many minutes before her appointment the patient is asked to arrive.
                  example: 30
                reminder_time:
                  type: string
                  pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                  description: |
                    Clinic-local `HH:MM` at which the visit-day reminder is
                    sent. Defaults to `11:00`.
                  example: "11:00"
                reminder_position:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: |
                    How many slot lengths before the visit the pre-visit
                    reminder goes out: this × the booking's own duration.
                    Defaults to `3`.
                  example: 3
                whatsapp_cancel_cutoff_minutes:
                  type: integer
                  enum: [0, 30, 60, 90, 120, 180, 240]
                  description: |
                    Inside this many minutes of the visit, the reminder's
                    Cancel button no longer cancels: the booking stays and the
                    patient is sent the clinic phone. `0` allows it until the
                    visit starts. Defaults to `60`.
                  example: 60
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Clinic" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ------------------------------------------------------------- Booking ----

  /bookings/calendar:
    get:
      tags: [Booking]
      summary: Booking calendar
      description: |
        Dense day strip plus sparse date-keyed booking cards. `status` filters
        cards only; counts always describe the whole day. Cards are ordered as
        the active queue: with-doctor, emergency arrived, normal arrived,
        emergency booked, normal booked, then finished history.
      operationId: bookingCalendar
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          example: "2026-08-08"
        - name: to
          in: query
          schema: { type: string, format: date }
          example: "2026-08-14"
        - name: status
          in: query
          schema:
            type: string
            enum: [booked, arrived, with_doctor, done, cancelled, no_show]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BookingCalendar" }

  /slots:
    get:
      tags: [Booking]
      summary: Start times for a day and visit type
      description: |
        **The list changes with the visit type** — a 30-minute procedure offers
        fewer start times than a 10-minute follow-up. Re-fetch whenever the
        secretary changes the type.

        Unavailable slots are **returned, not omitted**: render them greyed and
        struck through.

        Server-side rules: start times step by the clinic's `slot_step_minutes`;
        a visit must *finish* inside its period; a slot is blocked by any
        overlapping booking of any visit type; cancelled bookings free their
        slot; touching intervals do not collide.

        **After midnight.** On a day whose period runs past midnight, the
        list for that `date` carries on after 23:xx with `00:00`, `00:30`,
        `01:00`… in time order. Those slots belong to `date`, not the next
        day: book them by sending the same `date` and the `start_time` shown.
        Between midnight and the period's close the clinic's "today" is still
        the evening's date, so it stays bookable. Each of those slots carries
        `after_midnight: true`: show it as "بعد منتصف الليل".
      operationId: slots
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-08-08"
        - name: visit_type_id
          in: query
          required: true
          schema: { type: integer }
          example: 1
        - name: hold_token
          in: query
          required: false
          schema: { type: string }
          description: |
            Your own slot hold, if you are holding one. Everyone else's live
            holds come back as unavailable; yours does not, or you could not
            book the slot you are sitting on.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SlotDay" }
        "404":
          description: "`VISIT_TYPE_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /slot-holds:
    post:
      tags: [Booking]
      summary: Hold a slot while the booking is filled in
      description: |
        Claims a start time the moment the user taps it, before the rest of the
        form exists. Three clients now compete for the same times — this app,
        the clinic web app and the patient's own booking page — and a hold is
        what stops two of them spending a minute each on a slot only one can
        have.

        **Holds block everyone alike.** Staff do not override a patient and a
        patient does not override staff. A hold lapses on its own after
        `clinic.self_booking.hold_ttl_minutes`; nothing has to be called to
        expire it.

        The response carries a **token**:

        - send it as `hold_token` when creating the booking, or the write path
          will refuse the very slot this screen offered
        - send it back here as `token` when the user picks a different time,
          and the claim **moves** instead of leaving a second one behind
        - send it to `DELETE /slot-holds/{token}` when leaving the screen

        A slot already booked, already held by someone else, outside the
        clinic's hours or outside the booking window is refused with the same
        codes `POST /bookings` uses.
      operationId: holdSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, start_time, visit_type_id]
              properties:
                date: { type: string, format: date, example: "2026-08-08" }
                start_time: { type: string, example: "09:20" }
                visit_type_id: { type: integer, example: 1 }
                token:
                  type: string
                  description: Your existing hold, to move it rather than add one.
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SlotHold" }
        "409":
          description: "`SLOT_UNAVAILABLE`, `SLOT_OUTSIDE_WORKING_HOURS`, `SLOT_OUTSIDE_WINDOW`, `CLINIC_CLOSED_THAT_DAY`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /slot-holds/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: The token returned when the hold was taken.
    delete:
      tags: [Booking]
      summary: Release a held slot
      description: |
        Gives the slot back — the screen was closed, or the booking abandoned.

        Addressed by token rather than id, because the token is the only thing
        that proves the caller owns the hold; it is never returned by any
        listing. Always answers 200: a hold that has already lapsed, been
        booked, or never existed leaves nothing to free, and a client tidying
        up on its way out should not have to care which.
      operationId: releaseSlotHold
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }

  /patients/lookup:
    post:
      tags: [Booking]
      summary: Recognise a returning patient
      description: |
        Call as soon as the phone is complete; `name` and `visit_type_id` are
        optional so it can be called again as the form fills in.

        Matching is on the **normalised phone only**, never the name — a typo
        would otherwise split a patient's history.
      operationId: lookupPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "01012225521" }
                name: { type: string, example: سارة أحمد }
                visit_type_id:
                  type: integer
                  description: Supply it to get `visit_type_mismatch`.
                  example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatientLookup" }
        "422":
          description: "`INVALID_PHONE_NUMBER`, or validation"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /bookings:
    post:
      tags: [Booking]
      summary: Create a booking
      description: |
        The patient is created if the phone is new and reused if known — her ID
        code is generated once and never changes.

        `update_patient_name: true` replaces the stored name; without it a
        differing name is ignored, so a typo cannot quietly rewrite the record.

        `date` is the clinic day, not the calendar day: a 01:00 slot in
        Monday's 19:00–03:00 is booked with Monday's `date` and `start_time:
        "01:00"`, and comes back with Monday's `date` and `after_midnight:
        true`. The server knows it happens on Tuesday.

        Normal bookings require `start_time`. Emergency bookings use
        `booking_kind: emergency`, require `patient_location`, must not send
        `start_time`, and do not block a slot. `inside_clinic` emergency
        bookings are created as `arrived`; `on_way` starts as `booked`.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Booking" }
        "400":
          description: "`VISIT_TYPE_INACTIVE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`VISIT_TYPE_NOT_FOUND`, or `BOOKING_NOT_FOUND` when `rebooking_for_booking_id` is not awaiting rebooking"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: |
            `SLOT_UNAVAILABLE`, `SLOT_OUTSIDE_WORKING_HOURS`,
            `CLINIC_CLOSED_THAT_DAY` or `SLOT_OUTSIDE_WINDOW`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /bookings/{booking}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [Booking]
      summary: One booking
      operationId: showBooking
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Booking]
      summary: Edit a booking
      description: |
        Same body as create — a full replacement that re-runs the whole
        availability check. The booking never conflicts with itself.

        Editable while `booked` or `arrived` only. Changing the visit type
        re-snapshots price and duration; changing the phone moves the booking to
        a different patient.
      operationId: updateBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "400":
          description: "`BOOKING_NOT_EDITABLE` — `details.status` says which status blocked it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`SLOT_UNAVAILABLE` and friends"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # -------------------------------------------------------------- Status ----

  /bookings/{booking}/status:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [Status]
      summary: Change booking status
      description: |
        Sends the intended target explicitly. A double tap repeats the same
        target and returns `INVALID_STATUS_TRANSITION`; it never advances twice.
        `cancelled` stays on the separate cancel endpoint because it carries a
        reason.
      operationId: updateBookingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [arrived, with_doctor, done, no_show]
                  example: arrived
      responses:
        "200": { $ref: "#/components/responses/BookingCardResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /bookings/{booking}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [Status]
      summary: Cancel a booking
      description: |
        Patient cancellation only. No-show is a status transition to
        `no_show`; emergency cancellation comes from postpone/broadcast flows.

        A booking can be cancelled until it is completed.
      operationId: cancelBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [patient_cancelled]
                  description: |
                    `emergency` is set by the postpone flow and `incomplete` by
                    the nightly job; both are rejected here.
                  example: patient_cancelled
      responses:
        "200": { $ref: "#/components/responses/BookingCardResponse" }
        "400":
          description: "`BOOKING_NOT_CANCELLABLE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /bookings/{booking}/contacted:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [Postpone]
      summary: "تم الاتصال — tick a row on the call list"
      description: Keeps the secretary's place in a long list. It does not rebook anyone.
      operationId: markContacted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          booking_id: { type: integer }
                          contacted_at: { type: [string, "null"], format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /message-templates:
    get:
      tags: [Messaging]
      summary: List active WhatsApp templates
      description: Template bodies are previews; the app never sends free-form patient messages. With the clinic's WhatsApp off, only `day_cancelled` is listed.
      operationId: listMessageTemplates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/MessageTemplate" }

  /broadcasts:
    post:
      tags: [Messaging]
      summary: Send a template to many bookings
      description: |
        Uses the configured messaging driver. The shipped `log` driver records
        and marks messages sent without calling Meta. `day_cancelled` also
        cancels selected pending bookings with reason `emergency`.

        **WhatsApp switched off for the clinic** (`clinic.whatsapp_enabled`
        false in `/bootstrap`): `day_cancelled` still cancels, sends nothing,
        and returns `whatsapp_enabled: false` with every booking in `skipped`
        (reason `whatsapp_disabled`). Any other template is refused with 409.
      operationId: createBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key]
              properties:
                template_key:
                  type: string
                  enum: [day_cancelled, appointment_earlier, appointment_delayed]
                  example: day_cancelled
                date:
                  type: string
                  format: date
                  description: Used when `booking_ids` is omitted.
                booking_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MessageSendResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WhatsAppDisabled" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /bookings/{booking}/message:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [Messaging]
      summary: Send a template for one booking
      description: |
        With WhatsApp switched off for the clinic, behaves as `/broadcasts`
        does: `day_cancelled` cancels without a message, anything else is 409.
      operationId: sendBookingMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key]
              properties:
                template_key:
                  type: string
                  enum: [day_cancelled, appointment_earlier, appointment_delayed]
                  example: appointment_delayed
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MessageSendResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WhatsAppDisabled" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ------------------------------------------------------------ Postpone ----

  /postpone/candidates:
    get:
      tags: [Postpone]
      summary: Who a postponement would affect
      description: Today's `booked` + `arrived` — the multi-select behind "مريضات محددة".
      operationId: postponeCandidates
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/CallListResponse" }

  /postpone:
    post:
      tags: [Postpone]
      summary: Postpone today
      description: |
        Cancels the selected bookings with reason `emergency`, **frees their
        slots**, and returns the call list.

        WhatsApp template broadcasts are handled separately through
        `/broadcasts`. Omit `booking_ids` entirely for "كل المريضات".
      operationId: postpone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                booking_ids:
                  type: array
                  items: { type: integer }
                  description: Omit for everyone still pending.
                  example: [88, 91]
      responses:
        "200":
          description: Postponed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/CallListRow" }
                          postponed_count: { type: integer }
        "400":
          description: "`NOTHING_TO_POSTPONE` — including when the only patient left is with the doctor"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /rebooking-list:
    get:
      tags: [Postpone]
      summary: Patients awaiting a new appointment
      description: |
        Reachable any time from the home-screen banner, which is driven by
        `awaiting_rebooking_count` on the queue.

        Phones are **unmasked** — every row has a call action. To take a patient
        off this list, create a booking with `rebooking_for_booking_id` set.
      operationId: rebookingList
      responses:
        "200": { $ref: "#/components/responses/CallListResponse" }

  # ----------------------------------------------------------- Emergency ----

  /emergency/delay/options:
    get:
      tags: [Emergency]
      summary: The delays offered
      description: |
        The list behind "تأخير طارئ", already worded for display. Send the
        chosen `minutes` back as `delay_minutes`; nothing else is accepted.
      operationId: emergencyDelayOptions
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                minutes: { type: integer, example: 90 }
                                label: { type: string, example: ساعة ونصف }
        "403": { $ref: "#/components/responses/Forbidden" }

  /emergency:
    post:
      tags: [Emergency]
      summary: Delay today's appointments
      description: |
        One shot, no preview: the app's own confirmation dialog is the only
        confirmation.

        `booking_id` is the first patient to move — normally the first one
        still waiting. It moves by the whole `delay_minutes`; each later
        booking moves only as far as it must to start after the one before,
        so a free gap absorbs part of the delay and patients after it move
        less, or not at all. Patients with the doctor, done, cancelled or
        no-show stay where they are and their time counts as free.
        Emergencies have no time and are untouched. Earlier patients are
        untouched. Times past midnight stay on today's list
        (`after_midnight: true`).

        The time a delay frees is left open for booking.

        Every moved patient (booked or already in the clinic) is sent the
        `appointment_delayed` WhatsApp message with their new time. A patient
        who cannot be messaged is listed in `messaging.skipped` and the times
        still move. Reasons: `whatsapp_disabled` (the clinic's WhatsApp is
        off), `whatsapp_not_opted_in`, `template_not_ready` (the template is
        switched off).

        Sending the same request again within two minutes (a double tap, a
        retry) moves nobody and returns the first result with
        `replayed: true`. A later request is a new delay.
      operationId: emergency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, booking_id, delay_minutes]
              properties:
                action: { type: string, enum: [delay] }
                booking_id: { type: integer, example: 88 }
                delay_minutes:
                  type: integer
                  enum: [15, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300]
                  example: 60
      responses:
        "200":
          description: Delayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          moved_count: { type: integer }
                          replayed: { type: boolean }
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/DelayedBookingRow" }
                          messaging:
                            type: object
                            properties:
                              sent_count: { type: integer }
                              skipped_count: { type: integer }
                              skipped:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    booking_id: { type: integer }
                                    patient_id: { type: [integer, "null"] }
                                    reason:
                                      type: string
                                      enum: [template_not_ready, whatsapp_disabled, whatsapp_not_opted_in]
                              whatsapp_enabled: { type: [boolean, "null"] }
        "400":
          description: |
            `BOOKING_NOT_DELAYABLE` — `details.reason` is `not_today` (not
            today's booking) or `not_waiting` (with the doctor, done,
            cancelled, no-show, or an emergency).
            `DELAY_PAST_END_OF_DAY` — someone would end after the end of the
            clinic day (06:00); nobody is moved. `details.booking_id` is the
            first booking that would.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ------------------------------------------------------------ Patients ----

  /patients:
    get:
      tags: [Patients]
      summary: Search patients
      description: |
        Matches part of a name, the start of an ID code, or the last 4+ digits
        of a phone.

        **Phones are masked here** — there is no call action on a search result.
      operationId: searchPatients
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: Optional — an empty search lists everyone.
          example: سارة
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/PatientListItem" }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /reviews:
    get:
      tags: [Reviews]
      summary: The clinic's reviews
      description: |
        The whole reviews screen in one request.

        - `summary` is the card at the top: **every** review the clinic has,
          never narrowed by `rating` or the page, so it does not change when a
          chip is tapped. `satisfied_percent` is (very good + good) ÷ total,
          rounded; null while there are no reviews yet.
        - `items` is one page of the list, newest first, narrowed by `rating`.
          Reviews without a comment are included (`comment: null`).
        - `meta.total` is the count under the current filter ("جيد · 28 تقييم").

        Each item carries everything the details sheet shows — the whole
        comment (shorten it on screen for the list), the visit, and the
        patient's **unmasked** phone for the call and WhatsApp buttons — so the
        sheet needs no further request.
      operationId: listReviews
      parameters:
        - name: rating
          in: query
          schema: { type: string, enum: [very_good, good, bad] }
          description: The filter chip. Omit for "الكل".
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary: { $ref: "#/components/schemas/ReviewSummary" }
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/ReviewListItem" }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /patients/{patient}:
    parameters:
      - name: patient
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Patients]
      summary: A patient's file
      description: |
        Summary plus every visit, newest first — **cancellations and no-shows
        included**, each with its reason. A pattern of them is exactly what the
        secretary wants to see.

        The phone is **unmasked** here; this screen has a call action.
      operationId: showPatient
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatientFile" }
        "404":
          description: "`PATIENT_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ------------------------------------------------------------- Reports ----

  /reports/revenue:
    get:
      tags: [Reports]
      summary: Revenue
      description: |
        Three periods, each already compared against **the same span** of the
        previous one: on the 8th, `this_month` covers 8 days and is compared
        against the first 8 days of last month.

        Counts completed visits only, at the price recorded when each was
        booked. With fixed prices and no payment tracking in v1 this is
        *expected* revenue, not cash collected — label the screen accordingly.
      operationId: revenueReport
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RevenueReport" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/retention:
    get:
      tags: [Reports]
      summary: Retention
      description: |
        Cohort-based: the cohort is patients whose **first** completed visit
        fell in the period, and the rate is how many came back.

        `maturing_count` matters — a patient seen last week has not "never
        returned", she just has not returned *yet*. Show it separately from
        `first_visit_only_count` or the first month's number is meaningless.
      operationId: retentionReport
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [this_week, this_month, last_90_days, last_365_days]
            default: this_month
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RetentionReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`UNKNOWN_REPORT_PERIOD` — `details.allowed` lists the valid values"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /reports/web-link:
    post:
      tags: [Reports]
      summary: Reports page link for a WebView
      description: |
        A link that opens the doctor's reports page (day, week and month, with
        its period links) inside a WebView, already signed in. No password and
        no cookie handling on the app's side.

        **The link is single-use and lasts 5 minutes.** Request a new one each
        time the report screen opens, and load it straight away.

        Opening it starts the WebView's own session, which ends after a couple
        of hours without use; it is independent of this API token, which it
        never affects. Inside the app the page hides its own header and
        sign-out, and its period links are plain links.

        **Renewing, silently:** whenever the WebView cannot be signed in — the
        link was already used or lapsed, or the session ended — the page sends
        it to `renew_url` instead of a login form. Watch the WebView's
        navigation (iOS `decidePolicyFor navigationAction`, Android
        `shouldOverrideUrlLoading`): when it is about to load `renew_url`,
        cancel that load, call this endpoint again and load the new `url`.
        The WebView usually reaches `renew_url` through a redirect, so also
        act when a page **finishes loading** at `renew_url` (iOS
        `didFinish`, Android `onPageFinished`) — whichever fires first. If it
        is ever shown, `renew_url` only asks the user to reopen the report.

        On sign-out from the app, clear the WebView's cookies, so the next
        account on the same phone does not open the previous one's session.

        Who may: any account with report access whose clinic has reports
        switched on — the same rule as the website. Owner or secretary alike;
        this endpoint does not use the `reports.view` ability.
      operationId: reportWebLink
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ReportWebLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`REPORTS_NOT_AVAILABLE` — this account has no report access, or its clinic has reports off. Hide the entry point."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          description: Too many requests — at most 30 a minute per account.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The Sanctum token from `POST /auth/login`.

  parameters:
    BookingId:
      name: booking
      in: path
      required: true
      schema: { type: integer }
    VisitTypeId:
      name: visitType
      in: path
      required: true
      schema: { type: integer }

  responses:
    EmptySuccess:
      description: OK, no payload
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: { type: "null" }
    Unauthenticated:
      description: "`ACCESS_TOKEN_MISSING` — missing, invalid or revoked token"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: "`FORBIDDEN_ROLE` — the account lacks the ability for this endpoint"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ClinicScope:
      description: "`CLINIC_NOT_ASSIGNED`, `CLINIC_INACTIVE` or `ACCOUNT_INACTIVE`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Unknown id, or another clinic's record — never its data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: "`VALIDATION_FAILED` — `error.fields` maps each field to its messages"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BookingResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/Booking" }
    BookingCardResponse:
      description: The updated booking card
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/BookingCard" }
    CallListResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CallListRow" }
    WhatsAppDisabled:
      description: |
        `WHATSAPP_DISABLED` — a super admin has switched WhatsApp off for this
        clinic. Nothing was sent or changed. `/bootstrap` reports it as
        `clinic.whatsapp_enabled`, so the app can hide sending altogether.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    InvalidTransition:
      description: |
        `INVALID_STATUS_TRANSITION` — skipping a step or advancing a finished
        booking. `details.expected` names the status that was required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:

    SuccessEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status: { type: string, enum: [success] }
        message: { type: string, description: Localised; safe to show as-is. }

    ErrorEnvelope:
      type: object
      required: [status, message, error]
      properties:
        status: { type: string, enum: [error] }
        message: { type: string }
        error:
          type: object
          required: [code, details, fields]
          properties:
            code:
              type: string
              description: Stable UPPER_SNAKE. **Branch on this, never on `message`.**
            details:
              type: [object, "null"]
              description: Structured context for a few errors.
            fields:
              type: [object, "null"]
              description: Present on 422 only — field name to messages.
              additionalProperties:
                type: array
                items: { type: string }

    Display:
      type: object
      description: Machine value plus a ready-to-render string.
      required: [value, display]
      properties:
        value: { type: [string, integer] }
        display: { type: string }

    Money:
      allOf:
        - $ref: "#/components/schemas/Display"
      example: { value: "300.00", display: "300.00 ج.م" }

    Abilities:
      type: array
      description: |
        Drives what the app shows: `bookings.manage`, `queue.manage`,
        `patients.view`, `settings.manage`, `prices.view` and `reports.view`.
      items: { type: string }

    LoginPayload:
      type: object
      required: [title, token]
      properties:
        title:
          type: string
          description: Clinic name shown after login.
          example: عيادة د. سارة النجار
        token:
          type: string
          description: "Bearer token value. Send it as `Authorization: Bearer <token>`."
          example: 2|Jl8zwWnI4slugy2ieM5UyUROCjRkXcYOcjFxR0Aga18a36f0

    Clinic:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: [string, "null"] }
        phone: { oneOf: [{ $ref: "#/components/schemas/Display" }, { type: "null" }] }
        specialty: { type: [string, "null"] }
        timezone: { type: string, example: Africa/Cairo }
        country_code: { type: string, example: EG }
        booking_window_days: { type: integer }
        first_visit_only_days: { type: integer }
        slot_step_minutes: { type: integer }
        patient_arrival_lead_minutes:
          type: integer
          enum: [15, 20, 30, 45, 60]
          description: How many minutes before her appointment the patient is asked to arrive.
        reminder_time:
          type: string
          example: "11:00"
          description: |
            Clinic-local `HH:MM` at which the single visit-day reminder goes
            out. Defaults to `11:00`. Bookings created after this time are not
            reminded that day.
        reminder_position:
          type: integer
          minimum: 1
          maximum: 50
          example: 3
          description: |
            How many slot lengths before the visit the pre-visit reminder goes
            out: this × the booking's own duration. Defaults to `3`.
        whatsapp_cancel_cutoff_minutes:
          type: integer
          enum: [0, 30, 60, 90, 120, 180, 240]
          example: 60
          description: |
            Inside this many minutes of the visit, Cancel from the WhatsApp
            reminder is refused and the patient is sent the clinic phone
            instead. `0` allows it until the visit starts.
        whatsapp_cancel_cutoff_minute_options:
          type: array
          items: { type: integer, enum: [0, 30, 60, 90, 120, 180, 240] }
          example: [0, 30, 60, 90, 120, 180, 240]
        patient_arrival_lead_minute_options:
          type: array
          items: { type: integer, enum: [15, 20, 30, 45, 60] }
          example: [15, 20, 30, 45, 60]
        whatsapp_enabled:
          type: boolean
          description: |
            Whether this clinic sends WhatsApp at all. A super admin's switch;
            when false, hide message sending except "cancel the day", which
            still cancels but sends nothing. Templates from `/message-templates`
            are already narrowed to match.

    VisitType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: كشف }
        description:
          type: string
          nullable: true
          description: The line shown under this service on the clinic's public page.
          example: أول زيارة لتحديد الحالة
        duration_minutes: { type: integer }
        is_active: { type: boolean }
        is_new_patient_type:
          type: boolean
          description: |
            The clinic's "new concern" type. Booking a **returning** patient
            under it raises the visit-type mismatch warning. Exactly one per
            clinic; setting it elsewhere moves it.
        is_self_bookable:
          type: boolean
          description: |
            Whether a patient may choose this type for themselves on the
            clinic's public booking page. True by default; a clinic switches
            it off for anything unsuitable, such as a long procedure. Hidden
            types are never offered regardless.
        sort_order: { type: integer }
        price:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Present for clinic accounts.
        needs_price:
          type: boolean
          description: True while the price is still zero.

    VisitTypeInput:
      type: object
      required: [name, duration_minutes]
      properties:
        name: { type: string, maxLength: 100, example: سونار }
        description:
          type: string
          maxLength: 255
          nullable: true
          description: Optional. Shown under this service on the clinic's public page.
          example: أول زيارة لتحديد الحالة
        duration_minutes: { type: integer, minimum: 5, maximum: 480, example: 15 }
        price:
          type: number
          description: Accepted only from callers with `prices.view`; silently ignored otherwise.
          example: 250
        is_new_patient_type: { type: boolean }
        is_self_bookable:
          type: boolean
          description: |
            Whether a patient may choose this type on the clinic's public
            booking page. True by default. Hidden types are never offered
            regardless.

    ScheduleDay:
      type: object
      properties:
        day_of_week:
          allOf: [{ $ref: "#/components/schemas/Display" }]
          description: "0 = Saturday … 6 = Friday."
        is_open: { type: boolean }
        periods:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: "**Not stable** across a save — never hold onto it."
              start_time: { $ref: "#/components/schemas/Display" }
              end_time: { $ref: "#/components/schemas/Display" }
              ends_next_day:
                type: boolean
                description: |
                  True when the period runs past midnight (`19:00` → `03:00`):
                  it closes the next morning, and every booking in it stays on
                  this day. Show "ينتهي اليوم التالي". False for `23:59`,
                  which is how a shift ending at midnight is entered.

    Holiday:
      type: object
      properties:
        id: { type: integer }
        date: { $ref: "#/components/schemas/Display" }
        note: { type: [string, "null"] }

    BookingDay:
      type: object
      properties:
        date: { $ref: "#/components/schemas/Display" }
        day_of_week: { $ref: "#/components/schemas/Display" }
        day_number: { type: integer }
        is_open:
          type: boolean
          description: Already false on a holiday.
        is_holiday:
          type: boolean
          description: Check this only to show "إجازة" instead of a date.
        is_today: { type: boolean }
        bookings_count:
          type: integer
          description: Excludes cancelled.
        pending_count:
          type: integer
          description: The "X لسه ماخلصوش" number — booked plus arrived.

    SlotDay:
      type: object
      properties:
        date: { $ref: "#/components/schemas/Display" }
        is_open: { type: boolean }
        closed_reason:
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/Display" }]
            - type: "null"
          description: "`weekly_closed`, `holiday` or `outside_window`."
        visit_type:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            duration_minutes: { type: integer }
        available_count: { type: integer }
        slots:
          type: array
          items:
            type: object
            properties:
              start_time: { $ref: "#/components/schemas/Display" }
              end_time: { $ref: "#/components/schemas/Display" }
              is_available: { type: boolean }
              after_midnight:
                type: boolean
                description: |
                  True for a slot past midnight in a period that runs into the
                  next morning (`01:00` in `19:00`–`03:00`). It still belongs
                  to `date` and is booked with that `date`, but show it as
                  "بعد منتصف الليل" so it is not read as that morning.

    SlotHold:
      type: object
      properties:
        token:
          type: string
          description: |
            Keep this. It books the held slot, moves the claim to another
            time, and releases it. It is never returned anywhere else.
        date: { $ref: "#/components/schemas/Display" }
        start_time: { $ref: "#/components/schemas/Display" }
        end_time: { $ref: "#/components/schemas/Display" }
        after_midnight:
          type: boolean
          description: As on a slot — past midnight, still on `date`.
        visit_type_id: { type: integer }
        expires_at:
          type: string
          format: date-time
          description: When the claim lapses on its own.
        expires_in_seconds:
          type: integer
          description: Seconds remaining, for a countdown on the screen.

    PatientLookup:
      type: object
      properties:
        found: { type: boolean }
        phone: { $ref: "#/components/schemas/Display" }
        patient:
          type: [object, "null"]
          properties:
            id: { type: integer }
            code: { type: string, example: "60001" }
            name: { type: string }
            visits_count: { type: integer }
        is_returning: { type: boolean }
        name_conflict:
          type: boolean
          description: The typed name differs from the stored one — ask before overwriting.
        visit_type_mismatch:
          type: boolean
          description: A returning patient booked under the "new concern" type. Show the inline warning.
        last_visit:
          type: [object, "null"]
          properties:
            date: { $ref: "#/components/schemas/Display" }
            visit_type:
              type: object
              properties:
                id: { type: integer }
                name: { type: string }

    BookingInput:
      type: object
      required: [visit_type_id, date]
      properties:
        patient_id:
          type: integer
          description: Existing patient id. If present, patient_name and phone are ignored.
        patient_name: { type: string, maxLength: 255, example: سارة أحمد }
        phone: { type: string, maxLength: 32, example: "01012225521" }
        age: { type: [integer, "null"], minimum: 0, maximum: 130 }
        whatsapp_opt_in:
          type: boolean
          description: Defaults true for new patients; no WhatsApp message is sent without consent.
        visit_type_id: { type: integer, example: 1 }
        date: { type: string, format: date, example: "2026-08-08" }
        booking_kind:
          type: string
          enum: [normal, emergency]
          default: normal
          description: Normal bookings use a slot. Emergency bookings enter the priority queue without a slot.
        patient_location:
          type: string
          enum: [inside_clinic, on_way]
          description: Required only when `booking_kind` is `emergency`.
        start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "13:40"
          description: Required for normal bookings; prohibited for emergency bookings.
        notes: { type: [string, "null"], maxLength: 2000 }
        update_patient_name:
          type: boolean
          description: Confirms replacing the stored name for a known phone.
        rebooking_for_booking_id:
          type: integer
          description: The postponed booking this replaces — takes her off the call list.
        hold_token:
          type: string
          description: |
            The slot hold this booking redeems, from `POST /slot-holds`. The
            held slot is free to whoever holds it and to nobody else, so
            sending it back is what stops the write being refused the very
            time the screen offered. The hold is released as the booking is
            written.

    Booking:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/Display" }
        cancel_reason:
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/Display" }]
            - type: "null"
        booking_kind: { $ref: "#/components/schemas/Display" }
        patient_location:
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/Display" }]
            - type: "null"
        source:
          allOf: [{ $ref: "#/components/schemas/Display" }]
          description: |
            Which door the booking came through — `clinic` or `patient_web`.
            A second dimension beside `status`, like `booking_kind`: a
            self-booked visit is `booked` like any other and needs no
            approval from the clinic to become real. Informational — it
            drives a badge and a filter, never a rule.
        patient_response:
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/Display" }]
            - type: "null"
          description: |
            The patient's answer to the visit-day reminder — `confirmed` or
            `cancelled`. Null until she replies. A confirmation leaves
            `status` at `booked`; a cancellation moves it to `cancelled`.
        patient_responded_at:
          type: [string, "null"]
          format: date-time
          description: When the patient answered the reminder.
        reminder_status:
          allOf: [{ $ref: "#/components/schemas/Display" }]
          description: |
            `not_sent`, `sent` or `failed` for the reminder sent shortly before
            the appointment — the one with the tracking button.
        daily_reminder_status:
          allOf: [{ $ref: "#/components/schemas/Display" }]
          description: |
            The same reading for the visit-day reminder sent at the clinic's
            `reminder_time`, the one with Confirm and Cancel buttons.
        patient:
          type: [object, "null"]
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            phone:
              allOf: [{ $ref: "#/components/schemas/Display" }]
              description: Unmasked — the card has a call action.
        visit_type:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            duration_minutes:
              type: integer
              description: The snapshot from booking time, not the type's current value.
        date: { $ref: "#/components/schemas/Display" }
        start_time:
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/Display" }]
            - type: "null"
        end_time:
          oneOf:
            - allOf: [{ $ref: "#/components/schemas/Display" }]
            - type: "null"
        after_midnight:
          type: boolean
          description: |
            True when the visit is past midnight in an evening that ran into
            the next morning: `date` is Monday, `start_time` is `01:00`, and
            it happens on Tuesday at 01:00. Show "بعد منتصف الليل" next to the
            time; keep it on `date` everywhere. False with no `start_time`.
        queue_entered_at:
          type: [string, "null"]
          format: date-time
          description: Set when the patient physically enters the waiting queue.
        notes: { type: [string, "null"] }
        price:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Present for clinic accounts.

    BookingCard:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            next_status:
              oneOf:
                - allOf: [{ $ref: "#/components/schemas/Display" }]
                - type: "null"
            available_actions:
              type: array
              description: |
                Separate card actions such as `call`, `whatsapp`, `edit`,
                `no_show`, and `cancel`. The main transition button uses
                `next_status`. `no_show` appears only for `booked` and
                `arrived`; `cancel` also appears for `with_doctor`.
              items: { type: string }
            arrived_at: { type: [string, "null"], example: "09:05" }
            contacted_at: { type: [string, "null"], format: date-time }

    StatusCounts:
      type: object
      properties:
        total: { type: integer }
        normal_count: { type: integer }
        emergency_count: { type: integer }
        booked: { type: integer }
        arrived: { type: integer }
        with_doctor: { type: integer }
        done: { type: integer }
        cancelled: { type: integer }
        no_show: { type: integer }

    BookingCalendarDay:
      type: object
      properties:
        date: { $ref: "#/components/schemas/Display" }
        day_of_week: { $ref: "#/components/schemas/Display" }
        day_number: { type: integer }
        is_open: { type: boolean }
        is_holiday: { type: boolean }
        is_today: { type: boolean }
        counts: { $ref: "#/components/schemas/StatusCounts" }

    BookingCalendar:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/BookingCalendarDay" }
        bookings:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/BookingCard" }

    MessageTemplate:
      type: object
      properties:
        key: { type: string }
        category: { type: string, example: utility }
        body_ar: { type: string }

    MessageSendResult:
      type: object
      properties:
        template_key: { type: string }
        sent_count: { type: integer }
        skipped_count: { type: integer }
        cancelled_count: { type: integer }
        whatsapp_enabled:
          type: boolean
          description: False when the clinic's WhatsApp is off — nothing was sent.
        message_ids:
          type: array
          items: { type: integer }
        skipped:
          type: array
          items:
            type: object
            properties:
              booking_id: { type: integer }
              patient_id: { type: [integer, "null"] }
              reason: { type: string }

    CallListRow:
      type: object
      properties:
        booking_id: { type: integer }
        patient:
          type: [object, "null"]
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            phone:
              allOf: [{ $ref: "#/components/schemas/Display" }]
              description: Unmasked — every row has a call action.
        visit_type:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        original_date: { $ref: "#/components/schemas/Display" }
        original_start_time: { $ref: "#/components/schemas/Display" }
        after_midnight:
          type: boolean
          description: "`original_start_time` is past midnight, still on `original_date`."
        contacted: { type: boolean }
        contacted_at: { type: [string, "null"], format: date-time }

    DelayedBookingRow:
      type: object
      properties:
        booking_id: { type: integer }
        patient:
          type: [object, "null"]
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
        status: { $ref: "#/components/schemas/Display" }
        previous_start_time: { $ref: "#/components/schemas/Display" }
        start_time: { $ref: "#/components/schemas/Display" }
        end_time: { $ref: "#/components/schemas/Display" }
        after_midnight:
          type: boolean
          description: "`start_time` is past midnight, still on today's list."
        delay:
          type: object
          properties:
            minutes: { type: integer, example: 30 }
            label: { type: string, example: نصف ساعة }

    PatientListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: SAAH5521 }
        name: { type: string }
        phone:
          allOf: [{ $ref: "#/components/schemas/Display" }]
          description: "**Masked** — `0101***5521`. No call action on a search result."
        visits_count:
          type: integer
          description: Real visits only; cancellations and no-shows excluded.

    PatientFile:
      type: object
      properties:
        patient:
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            phone:
              allOf: [{ $ref: "#/components/schemas/Display" }]
              description: Unmasked — this screen has a call action.
            registered_at: { $ref: "#/components/schemas/Display" }
        summary:
          type: object
          properties:
            visits_count: { type: integer }
            no_show_count: { type: integer }
            cancelled_count: { type: integer }
            first_visit: { oneOf: [{ $ref: "#/components/schemas/Display" }, { type: "null" }] }
            last_visit: { oneOf: [{ $ref: "#/components/schemas/Display" }, { type: "null" }] }
        visits:
          type: array
          description: Newest first, cancellations and no-shows included.
          items:
            type: object
            properties:
              booking_id: { type: integer }
              date: { $ref: "#/components/schemas/Display" }
              start_time: { $ref: "#/components/schemas/Display" }
              after_midnight:
                type: boolean
                description: "`start_time` is past midnight, still on `date`."
              visit_type:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  duration_minutes:
                    type: integer
                    description: The snapshot, so an old visit reads as it was booked.
              status: { $ref: "#/components/schemas/Display" }
              cancel_reason:
                oneOf:
                  - allOf: [{ $ref: "#/components/schemas/Display" }]
                  - type: "null"
              notes: { type: [string, "null"] }
              price:
                allOf: [{ $ref: "#/components/schemas/Money" }]
                description: Owner only.

    ReviewSummary:
      type: object
      properties:
        total: { type: integer, example: 214 }
        satisfied_percent:
          type: [integer, "null"]
          example: 97
          description: (very good + good) ÷ total, rounded. Null with no reviews.
        ratings:
          type: array
          description: Always all three, best first.
          items:
            type: object
            properties:
              value: { type: string, enum: [very_good, good, bad] }
              display: { type: string, example: بعض الملاحظات }
              count: { type: integer, example: 6 }

    ReviewListItem:
      type: object
      properties:
        id: { type: integer }
        rating: { $ref: "#/components/schemas/Display" }
        comment:
          type: [string, "null"]
          description: Whole — shorten it on screen. Null when the patient left none.
        submitted_at: { type: string, format: date-time }
        patient:
          type: [object, "null"]
          properties:
            id: { type: integer }
            code: { type: string, example: "60189" }
            name: { type: string }
            phone:
              allOf: [{ $ref: "#/components/schemas/Display" }]
              description: Unmasked — the details sheet calls and messages the patient.
        visit:
          type: [object, "null"]
          properties:
            booking_id: { type: integer }
            date: { $ref: "#/components/schemas/Display" }
            day: { type: string, example: الثلاثاء }
            start_time:
              oneOf:
                - { $ref: "#/components/schemas/Display" }
                - { type: "null" }
              description: Null for an emergency, which has no time.
            after_midnight:
              type: boolean
              description: "`start_time` is past midnight, still on `date`."
            visit_type:
              type: object
              properties:
                id: { type: integer }
                name: { type: string, example: كشف }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    RevenuePeriod:
      type: object
      properties:
        total: { $ref: "#/components/schemas/Money" }
        completed_visits: { type: integer }
        from: { $ref: "#/components/schemas/Display" }
        to: { $ref: "#/components/schemas/Display" }
        comparison:
          type: object
          properties:
            label: { type: string, example: مقارنة بإمبارح }
            previous_total: { $ref: "#/components/schemas/Money" }
            previous_visits: { type: integer }
            difference: { $ref: "#/components/schemas/Money" }
            change_percent:
              type: [number, "null"]
              description: Null when the previous period earned nothing — growth from zero is not a percentage.
            direction: { type: string, enum: [up, down, flat] }

    ReportWebLink:
      type: object
      required: [url, expires_at, renew_url]
      properties:
        url:
          type: string
          format: uri
          description: Open in the WebView. Single-use.
          example: https://elayadah.com/reports/app/open/mBCLwjFiswEu0zjJ88DHgme4oXFTsA08iwEIrKcVhhaUr0aQ4mtoOEGkRuN25utR
        expires_at:
          type: string
          format: date-time
          description: After this the link only leads to `renew_url`.
        renew_url:
          type: string
          format: uri
          description: The address to watch for. When the WebView is about to load it, ask for a new link instead.
          example: https://elayadah.com/reports/app/renew

    RevenueReport:
      type: object
      properties:
        currency: { type: string, example: ج.م }
        periods:
          type: object
          properties:
            today: { $ref: "#/components/schemas/RevenuePeriod" }
            this_week: { $ref: "#/components/schemas/RevenuePeriod" }
            this_month: { $ref: "#/components/schemas/RevenuePeriod" }
        daily:
          type: array
          description: This month day by day, zeros included so it plots directly.
          items:
            type: object
            properties:
              date: { $ref: "#/components/schemas/Display" }
              total: { $ref: "#/components/schemas/Money" }

    RetentionReport:
      type: object
      properties:
        period:
          type: object
          properties:
            value: { type: string }
            display: { type: string }
            from: { $ref: "#/components/schemas/Display" }
            to: { $ref: "#/components/schemas/Display" }
        available_periods:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              display: { type: string }
        cohort_size:
          type: integer
          description: Patients whose **first** completed visit fell in the period.
        returned_count: { type: integer }
        return_rate:
          type: [number, "null"]
          description: Percentage, or null when the cohort is empty — not 0.
        first_visit_only_count:
          type: integer
          description: Seen once, more than `maturity_days` ago.
        maturing_count:
          type: integer
          description: Seen once, but still recent enough that she might return.
        maturity_days: { type: integer }
        visits_in_period: { type: integer }
        total_patients: { type: integer }
