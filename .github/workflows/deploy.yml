name: Deploy

# The deploy itself, shared by production and staging. Not triggered on its
# own: deploy-production.yml and deploy-staging.yml call it once the tests
# have passed, each with the folder, branch and compose stack of its own copy
# on the box.

on:
  workflow_call:
    inputs:
      environment:
        description: production or staging — names the run and the lock
        required: true
        type: string
      dir:
        description: the checkout on the VPS
        required: true
        type: string
      branch:
        required: true
        type: string
      stack:
        description: compose project name (STACK_NAME in that checkout's .env)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} to VPS
    # Production and staging share one box: never deploy both at once. They
    # used to — pushing develop and main together started two builds on two
    # CPUs and two runners hitting SSH in the same seconds. Queued, not
    # cancelled: every release still lands, one after the other.
    concurrency:
      group: doctor-1-vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_DIR: ${{ inputs.dir }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
          DEPLOY_STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Set VPS_HOST secret}"
          : "${VPS_USER:?Set VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY secret}"

          VPS_PORT="${VPS_PORT:-22}"
          SSH_HOST="${VPS_HOST#http://}"
          SSH_HOST="${SSH_HOST#https://}"
          SSH_HOST="${SSH_HOST%%/*}"
          SSH_HOST="${SSH_HOST%/}"

          if [ -z "$SSH_HOST" ]; then
            echo "VPS_HOST must be a hostname, for example: srv1362420.hstgr.cloud" >&2
            exit 1
          fi

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_PORT must be only the port number, for example: 22" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/doctor_1_deploy
          chmod 600 ~/.ssh/doctor_1_deploy

          # The server's host key, pinned. It used to be fetched with
          # ssh-keyscan on every run, which both trusted whatever answered and
          # failed the whole deploy whenever that one probe went unanswered
          # within its 5-second timeout — the production deploy of 2ede34b
          # died exactly that way, 5 seconds in, before it reached the box.
          #
          # If the VPS is ever rebuilt its key changes and this refuses to
          # connect: on the box, `cat /etc/ssh/ssh_host_ed25519_key.pub`, and
          # replace the line below. Fingerprint today:
          # SHA256:DZUdLljMwxgpPv6Lc+NNp/NzJ+mnEYcrYipopZeN2fQ
          printf '%s\n' 'doctor1-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPtNXc2mgVPvGV1mZBRuhlZuiVnxQrCGdutlAGS+0VQC' > ~/.ssh/known_hosts

          SSH_OPTS=(
            -i ~/.ssh/doctor_1_deploy
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o HostKeyAlias=doctor1-vps
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
          )

          # A dropped first connection is a network blip, not a reason to
          # abandon a release that already passed its tests.
          echo "Testing SSH authentication..."
          for attempt in 1 2 3 4; do
            if ssh "${SSH_OPTS[@]}" "$VPS_USER@$SSH_HOST" "echo SSH connection OK"; then
              break
            fi

            if [ "$attempt" = 4 ]; then
              echo "SSH failed four times. Check VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY, and the pinned host key above." >&2
              exit 1
            fi

            echo "SSH attempt ${attempt} failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

          # The script below is quoted, so nothing in it expands here; the
          # four values it needs travel as variables on the remote command.
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$SSH_HOST" \
            "DEPLOY_ENV='$DEPLOY_ENV' DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_BRANCH='$DEPLOY_BRANCH' DEPLOY_STACK='$DEPLOY_STACK' bash -s" <<'DEPLOY'
            set -euo pipefail

            cd "$DEPLOY_DIR"

            # The stack this checkout's .env names must be the one this
            # workflow was told to deploy. A staging checkout whose .env lost
            # STACK_NAME would otherwise rebuild *production's* containers.
            CONFIGURED_STACK="$(docker compose -f compose.prod.yml config --format json < /dev/null | sed -n 's/^ *"name": "\([^"]*\)".*/\1/p' | head -1)"
            if [ "$CONFIGURED_STACK" != "$DEPLOY_STACK" ]; then
              echo "This checkout resolves to compose project '${CONFIGURED_STACK}', expected '${DEPLOY_STACK}'. Refusing to deploy." >&2
              exit 1
            fi

            # One deploy at a time on the box. The concurrency group above only
            # keeps *workflow runs* from overlapping; it says nothing about a
            # deploy somebody runs by hand over ssh. Two of those racing on one
            # git worktree and one compose project is how a release half lands.
            exec 9>"/tmp/${DEPLOY_STACK}-deploy.lock"
            if ! flock -w 1200 9; then
              echo "Another deploy still holds the lock after 20 minutes." >&2
              exit 1
            fi

            # Named steps. A failure here used to report nothing but "exit
            # code 1", which left the log saying only that something went
            # wrong somewhere in thirty lines.
            echo "--- git ---"

            # A deploy has already been lost to one failed fetch. The whole
            # release is worth more than five seconds of waiting.
            for attempt in 1 2 3; do
              if git fetch origin "$DEPLOY_BRANCH" && git pull --ff-only origin "$DEPLOY_BRANCH"; then
                break
              fi

              if [ "$attempt" = 3 ]; then
                echo "git fetch/pull failed three times; leaving the box on $(git rev-parse --short HEAD)." >&2
                exit 1
              fi

              echo "git attempt ${attempt} failed, retrying in 5s..."
              sleep 5
            done

            git --no-pager log --oneline -1

            echo "--- build ---"
            # < /dev/null for the same reason as the artisan commands below:
            # this script arrives on ssh's stdin, so anything that reads stdin
            # eats the rest of it.
            docker compose -f compose.prod.yml up -d --build --force-recreate < /dev/null

            echo "Waiting for web container health..."
            WEB_HEALTH=""
            for attempt in {1..30}; do
              WEB_HEALTH="$(docker inspect --format='{{.State.Health.Status}}' "${DEPLOY_STACK}-web-1" 2>/dev/null || true)"
              echo "Web health attempt ${attempt}: ${WEB_HEALTH:-unknown}"

              if [ "$WEB_HEALTH" = "healthy" ]; then
                break
              fi

              sleep 2
            done

            if [ "$WEB_HEALTH" != "healthy" ]; then
              docker compose -f compose.prod.yml ps
              docker compose -f compose.prod.yml logs --tail=120 web app
              echo "Web container did not become healthy." >&2
              exit 1
            fi

            echo "--- migrate and caches ---"
            # Each exec is given its own stdin. Without it the first one reads
            # the rest of this script — which arrives over ssh on stdin — and
            # every command below it silently never runs.
            docker compose -f compose.prod.yml exec -T app php artisan migrate --force < /dev/null
            # Upserts keyed on `key`, so this is safe on every deploy and never
            # disturbs a template Meta has already approved. Not `db:seed`,
            # which would also reset the super admin's password.
            docker compose -f compose.prod.yml exec -T app php artisan db:seed --class=MessageTemplateSeeder --force < /dev/null
            docker compose -f compose.prod.yml exec -T app php artisan optimize:clear < /dev/null
            docker compose -f compose.prod.yml exec -T app php artisan filament:optimize < /dev/null

            echo "--- deployed $(git rev-parse --short HEAD) to ${DEPLOY_ENV} ---"
          DEPLOY
