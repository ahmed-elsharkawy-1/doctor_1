name: Deploy production

# main is production. Nothing reaches it until the tests have passed; changes
# are meant to have been through staging first (develop → staging, then a pull
# request develop → main).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: doctor-1-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      dir: /docker/doctor_1
      branch: main
      stack: doctor_1
