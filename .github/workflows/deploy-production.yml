name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: doctor-1-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Set VPS_HOST secret}"
          : "${VPS_USER:?Set VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY secret}"

          VPS_PORT="${VPS_PORT:-22}"

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_PORT must be only the port number, for example: 22" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/doctor_1_deploy
          chmod 600 ~/.ssh/doctor_1_deploy

          echo "Scanning VPS SSH host key..."
          if ! ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Could not scan the VPS SSH host key. Check VPS_HOST and VPS_PORT secrets." >&2
            exit 1
          fi

          SSH_OPTS=(
            -i ~/.ssh/doctor_1_deploy
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
          )

          echo "Testing SSH authentication..."
          if ! ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" "echo SSH connection OK"; then
            echo "SSH authentication failed. Check VPS_USER, VPS_SSH_KEY, and /root/.ssh/authorized_keys on the VPS." >&2
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" <<'DEPLOY'
            set -euo pipefail

            cd /docker/doctor_1
            git fetch origin main
            git pull --ff-only origin main

            docker compose -f compose.prod.yml up -d --build --force-recreate
            docker compose -f compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f compose.prod.yml exec -T app php artisan filament:optimize
          DEPLOY

          if [ -n "${DEPLOY_URL:-}" ]; then
            HEALTH_URL="${DEPLOY_URL%/}"
            if [[ "$HEALTH_URL" != */up ]]; then
              HEALTH_URL="${HEALTH_URL}/up"
            fi

            echo "Checking deployed application health endpoint..."
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$HEALTH_URL" > /dev/null
          fi
