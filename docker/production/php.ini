expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M

; Session upload progress is off: Laravel keeps its own sessions and never
; uses PHP's, so nothing here needs it — and it is the entry point the PHP
; team asked everyone to close (CVE-2026-109619, CVE-2026-115560, Oct 2026).
session.upload_progress.enabled = 0
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
